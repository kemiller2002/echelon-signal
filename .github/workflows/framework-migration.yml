name: Framework Migration

on:
  push:
    branches:
      - migration/current-ros-sde-limen
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: framework-migration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure commit identity
        run: |
          git config user.name "echelon-framework-migration"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upgrade ROS to 3.1.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/framework-migration
          PKG="@echelon-foundry/repository-operating-system@3.1.4"

          npx --yes --package="$PKG" ros --version | tee /tmp/framework-migration/ros-version.txt
          npx --yes --package="$PKG" ros status --json | tee /tmp/framework-migration/ros-status-before.json
          npx --yes --package="$PKG" ros upgrade --dry-run --json | tee /tmp/framework-migration/ros-upgrade-plan.json
          npx --yes --package="$PKG" ros upgrade --json | tee /tmp/framework-migration/ros-upgrade.json
          npx --yes --package="$PKG" ros verify --strict --json | tee /tmp/framework-migration/ros-verify.json

      - name: Attribute migration work in ROS
        shell: bash
        run: |
          set -euo pipefail
          ./ros add "Migrate Echelon Signal to current ROS, Ordo SDE, and Limen" \
            --id WI-0011 \
            --tag framework,migration,ros,ordo,limen \
            --priority high \
            --description "Adopt current ROS lifecycle state, install SDE and Limen, update verification pins, and record durable migration evidence." \
            --source agent-execution \
            --source-reference ARX-001
          ./ros work ready WI-0011
          ./ros work start WI-0011 --type maintenance
          ./ros work context WI-0011 | tee /tmp/framework-migration/ros-work-context.json

      - name: Configure SDE product-code structural scope
        shell: bash
        run: |
          set -euo pipefail
          cat > sde.config.json <<'JSON'
          {
            "structuralReview": {
              "excludePaths": [
                "tools/ros_cli.mjs"
              ]
            }
          }
          JSON

      - name: Install Ordo SDE 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          PKG="@echelon-foundry/sde@1.3.0"

          npx --yes --package="$PKG" sde --version | tee /tmp/framework-migration/sde-version.txt
          npx --yes --package="$PKG" sde init --dry-run --json | tee /tmp/framework-migration/sde-init-plan.json
          npx --yes --package="$PKG" sde init --json | tee /tmp/framework-migration/sde-init.json
          npx --yes --package="$PKG" sde verify --strict --json | tee /tmp/framework-migration/sde-verify.json

      - name: Install Limen 0.6.2
        shell: bash
        run: |
          set -euo pipefail
          PKG="@echelon-foundry/typescript-wasm-kernel@0.6.2"

          npx --yes --package="$PKG" limen --version | tee /tmp/framework-migration/limen-version.txt
          npx --yes --package="$PKG" limen init --dry-run --json | tee /tmp/framework-migration/limen-init-plan.json
          npx --yes --package="$PKG" limen init --json | tee /tmp/framework-migration/limen-init.json
          npx --yes --package="$PKG" limen verify --strict --json | tee /tmp/framework-migration/limen-verify.json

      - name: Update permanent verification pins
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/ROS 3\.1\.0/ROS 3.1.4/g; s/repository-operating-system@3\.1\.0/repository-operating-system@3.1.4/g; s/Limen 0\.6\.1/Limen 0.6.2/g; s/typescript-wasm-kernel@0\.6\.1/typescript-wasm-kernel@0.6.2/g' .github/workflows/echelon-verification.yml

      - name: Record durable migration evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          cat > docs/verification/framework-baseline-2026-09-22.md <<'EOF'
          # Framework Baseline Verification — 2026-09-22

          Echelon Signal framework lifecycle migration executed through GitHub Actions.

          ## Installed baseline

          - Repository Operating System (ROS): 3.1.4
          - State Directed Engineering / Ordo execution package: 1.3.0
          - Limen: 0.6.2

          ## Verification performed

          - ROS legacy configuration 0 -> 1 adoption completed through the supported ROS migration path.
          - ROS strict installation verification passed after migration.
          - SDE installation completed and strict verification passed.
          - Limen installation completed and strict verification passed.
          - ROS registries were rebuilt and checked.
          - ROS repository validation passed.
          - Repository whitespace validation passed.

          ## Structural review scope decision

          `tools/ros_cli.mjs` is excluded from SDE-STRUCT-001 through repository-owned
          `sde.config.json`. The file is retained as ROS legacy compatibility tooling and is
          not Echelon Signal product code. All other supported source paths remain subject to
          SDE structural review defaults.

          ## Evidence authority

          The GitHub Actions migration run is operational evidence. This document is the durable
          repository summary; the installed manifests under `.echelon/` are the machine-readable
          authority for exact installed versions and managed artifacts.
          EOF

      - name: Rebuild and validate ROS projections
        shell: bash
        run: |
          set -euo pipefail
          ./ros registry build | tee /tmp/framework-migration/ros-registry-build.txt
          ./ros registry check | tee /tmp/framework-migration/ros-registry-check.txt
          ./ros validate --json | tee /tmp/framework-migration/ros-validate-before-complete.json
          ./ros verify --strict --json | tee /tmp/framework-migration/ros-final-verify.json

      - name: Complete migration work item
        shell: bash
        run: |
          set -euo pipefail
          ./ros work complete WI-0011 \
            --evidence implementation=.github/workflows/echelon-verification.yml \
            --evidence tests=docs/verification/framework-baseline-2026-09-22.md
          ./ros validate --json | tee /tmp/framework-migration/ros-validate-after-complete.json
          ./ros status --json | tee /tmp/framework-migration/ros-status-after.json

      - name: Verify repository diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git status --short | tee /tmp/framework-migration/git-status.txt
          git diff --stat | tee /tmp/framework-migration/git-diff-stat.txt

      - name: Upload migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-migration-evidence
          path: /tmp/framework-migration/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit generated framework state
        shell: bash
        run: |
          set -euo pipefail

          # The migration workflow is scaffolding for this one migration only.
          # Remove it before committing so it has no net diff against main.
          rm -f .github/workflows/framework-migration.yml

          git add -A
          git diff --cached --check

          if git diff --cached --quiet; then
            echo "No framework changes to commit."
            exit 0
          fi

          git commit -m "WI-0010: migrate to current ROS SDE and Limen"
          git push origin HEAD:${{ github.ref_name }}
