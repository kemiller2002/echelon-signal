name: Temporary Signal verification attribution

on:
  push:
    branches:
      - "chore/echelon-capabilities-2026-09-21"

permissions:
  contents: write

jobs:
  attribute:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: "chore/echelon-capabilities-2026-09-21"
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Record verification repair through ROS
        shell: bash
        env:
          ROS_ACTOR: agent:chatgpt
        run: |
          set -euo pipefail
          git fetch origin main
          export ROS_BASE_REF=origin/main
          work_id="SIGNAL-VERIFY-2026-09-21"
          ./ros add "Align verification with current Echelon capability contracts"             --id "$work_id"             --tag ci,ordo,ros,sde             --priority high             --source agent-discovery             --source-reference "capability-rollout-verification-repair"
          ready_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./ros work backlog-transition --id "$work_id" --action ready --occurred-at "$ready_at"
          sleep 1
          start_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./ros work start --id "$work_id" --occurred-at "$start_at" --type mechanical --actor agent:chatgpt
          sleep 1
          done_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          ./ros work complete --id "$work_id" --occurred-at "$done_at" --actor agent:chatgpt
          ./ros validate
      - name: Commit attribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Echelon Upgrade Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git reset ".github/workflows/signal-verification-attribution.yml"
          git commit -m "chore: attribute Signal verification repair"
          git push origin HEAD:"chore/echelon-capabilities-2026-09-21"
