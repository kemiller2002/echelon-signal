name: Scoring Selector Requirements Pass

on:
  push:
    branches:
      - requirements/scoring-selector-completeness

permissions:
  contents: write

jobs:
  attribute:
    if: "${{ github.event.head_commit.message != 'SIGNAL-SCORING-SELECTORS-ATTRIBUTION-2026-09-22: complete branch attribution' }}"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Attribute the complete branch diff through ROS
        shell: bash
        env:
          ROS_BASE_REF: cb1c394eb4b97c35baffe8b77eb2293fe22ea568
        run: |
          set -euo pipefail
          git config user.name "echelon-requirements-pass"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          ./ros add "Attribute scoring and selector completeness branch diff" \
            --id SIGNAL-SCORING-SELECTORS-ATTRIBUTION-2026-09-22 \
            --tag requirements \
            --tag scoring \
            --tag selectors \
            --tag governance \
            --priority high \
            --description "Bind the complete main-to-branch scoring/selector requirements diff to durable ROS completion provenance after incremental repository commits." \
            --source agent-execution \
            --source-reference scoring-selector-completeness-2026-09-22 \
            --occurred-at 2026-09-22T13:31:00.000Z

          ./ros work backlog-transition \
            --id SIGNAL-SCORING-SELECTORS-ATTRIBUTION-2026-09-22 \
            --action ready \
            --occurred-at 2026-09-22T13:31:01.000Z

          ./ros work start \
            --id SIGNAL-SCORING-SELECTORS-ATTRIBUTION-2026-09-22 \
            --type documentation \
            --occurred-at 2026-09-22T13:31:02.000Z

          ./ros validate --json

          ./ros work complete \
            --id SIGNAL-SCORING-SELECTORS-ATTRIBUTION-2026-09-22 \
            --occurred-at 2026-09-22T13:31:59.000Z \
            --evidence implementation=input-documents/survey-engine-scoring-selector-completeness-requirements.txt \
            --evidence tests=docs/requirements/survey-engine-requirements-migration-validation.md

          ./ros validate --json
          ./ros verify --strict --json
          git diff --check

          git add .ros registries
          git commit -m "SIGNAL-SCORING-SELECTORS-ATTRIBUTION-2026-09-22: complete branch attribution"
          git push origin HEAD:${{ github.ref_name }}
