name: Current Framework Finalization

on:
  push:
    branches:
      - migration/framework-current-final

permissions:
  contents: write

concurrency:
  group: current-framework-finalization-${{ github.ref }}
  cancel-in-progress: false

jobs:
  finalize:
    if: "${{ github.event.head_commit.message != 'SIGNAL-FRAMEWORK-2026-09-22: finalize current framework baseline' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out finalization branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure commit identity
        run: |
          git config user.name "echelon-framework-finalization"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Upgrade ROS 3.1.3 to 3.1.4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/framework-finalization
          PKG="@echelon-foundry/repository-operating-system@3.1.4"

          npx --yes --package="$PKG" ros --version | tee /tmp/framework-finalization/ros-version.txt
          npx --yes --package="$PKG" ros status --json | tee /tmp/framework-finalization/ros-status-before.json
          npx --yes --package="$PKG" ros upgrade --dry-run --json | tee /tmp/framework-finalization/ros-upgrade-plan.json
          npx --yes --package="$PKG" ros upgrade --json | tee /tmp/framework-finalization/ros-upgrade.json
          npx --yes --package="$PKG" ros verify --strict --json | tee /tmp/framework-finalization/ros-verify-after-upgrade.json

      - name: Start ROS work item
        shell: bash
        run: |
          set -euo pipefail
          ./ros add "Finalize Echelon Signal current ROS, Ordo SDE, and Limen baseline" \
            --id SIGNAL-FRAMEWORK-2026-09-22 \
            --tag framework \
            --tag migration \
            --tag ros \
            --tag ordo \
            --tag limen \
            --priority high \
            --description "Upgrade current main from ROS 3.1.3 to 3.1.4 and Limen 0.6.1 to 0.6.2, enforce strict SDE verification, and define Signal's explicit F# and browser Limen boundaries without replaying legacy migration state." \
            --source agent-execution \
            --source-reference ARX-001 \
            --occurred-at 2026-09-22T09:00:00.000Z
          ./ros work backlog-transition \
            --id SIGNAL-FRAMEWORK-2026-09-22 \
            --action ready \
            --occurred-at 2026-09-22T09:00:01.000Z
          ./ros work start \
            --id SIGNAL-FRAMEWORK-2026-09-22 \
            --type maintenance \
            --occurred-at 2026-09-22T09:00:02.000Z
          ./ros work context SIGNAL-FRAMEWORK-2026-09-22 | tee /tmp/framework-finalization/work-context.json

      - name: Enforce strict SDE 1.3.0
        shell: bash
        run: |
          set -euo pipefail
          PKG="@echelon-foundry/sde@1.3.0"

          cat > sde.config.json <<'JSON'
          {
            "structuralReview": {
              "excludePaths": [
                "tools/ros_cli.mjs"
              ]
            }
          }
          JSON

          npx --yes --package="$PKG" sde status --json | tee /tmp/framework-finalization/sde-status.json
          npx --yes --package="$PKG" sde verify --strict --json | tee /tmp/framework-finalization/sde-verify.json

      - name: Upgrade and configure Limen 0.6.2
        shell: bash
        run: |
          set -euo pipefail
          PKG="@echelon-foundry/typescript-wasm-kernel@0.6.2"

          npx --yes --package="$PKG" limen --version | tee /tmp/framework-finalization/limen-version.txt
          npx --yes --package="$PKG" limen status --json | tee /tmp/framework-finalization/limen-status-before.json
          npx --yes --package="$PKG" limen upgrade --dry-run --json | tee /tmp/framework-finalization/limen-upgrade-plan.json
          npx --yes --package="$PKG" limen upgrade --json | tee /tmp/framework-finalization/limen-upgrade.json

          mkdir -p src/Echelon.Signal.Engine src/Echelon.Signal.Browser

          cat > limen.config.json <<'JSON'
          {
            "configurationVersion": 1,
            "boundary": {
              "engine": [
                "src/Echelon.Signal.Engine"
              ],
              "kernel": [
                "src/Echelon.Signal.Browser"
              ]
            }
          }
          JSON

          cat > src/Echelon.Signal.Engine/README.md <<'EOF'
          # Echelon Signal Engine Boundary

          This directory owns application meaning for Echelon Signal.

          Production domain state, legal transitions, scoring, validation, privacy rules,
          capabilities, obligations, effects-as-data, and view projection belong on this
          side of the Limen boundary. The production implementation is F#/.NET WebAssembly.

          Browser APIs and DOM authority do not belong here.
          EOF

          cat > src/Echelon.Signal.Browser/README.md <<'EOF'
          # Echelon Signal Browser Boundary

          This directory is the thin browser-facing side of the Limen boundary.

          Code here may perform mechanical loading, serialization, transport wiring, and
          browser integration through Limen. It must not own or re-derive Signal domain
          decisions, scoring, validation, privacy rules, capabilities, or application state.

          The generic browser kernel itself is supplied by Limen.
          EOF

          npx --yes --package="$PKG" limen verify --strict --json | tee /tmp/framework-finalization/limen-verify.json

      - name: Update permanent verification baseline
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/echelon-verification.yml")
          text = path.read_text()
          replacements = [
              ("Legacy ROS snapshot validation", "Repository ROS validation"),
              ("Legacy ROS validation", "Repository ROS validation"),
              ("ROS 3.1.3", "ROS 3.1.4"),
              ("@echelon-foundry/repository-operating-system@3.1.3", "@echelon-foundry/repository-operating-system@3.1.4"),
              ("Limen 0.6.1", "Limen 0.6.2"),
              ("@echelon-foundry/typescript-wasm-kernel@0.6.1", "@echelon-foundry/typescript-wasm-kernel@0.6.2"),
              ("sde verify --json", "sde verify --strict --json")
          ]
          for old, new in replacements:
              text = text.replace(old, new)
          path.write_text(text)

          advanced = Path("input-documents/survey-engine-advanced-ros-ordo-limen-stress-requirements.txt")
          text = advanced.read_text()
          text = text.replace(
              "Repository Operating System (ROS): current supported release, with 3.1.0 the observed current release at the time this requirement was written.",
              "Repository Operating System (ROS): current supported release, with 3.1.4 the verified current release as of 2026-09-22."
          )
          text = text.replace(
              "Limen: 0.6.1 or newer compatible release.",
              "Limen: 0.6.2 or newer compatible release."
          )
          advanced.write_text(text)

          ledger = Path("docs/requirements/survey-engine-requirements-migration.md")
          text = ledger.read_text()
          old = (
              "At extension review time, the repository's installed ROS configuration identifies "
              "1.2.1-main.16.1, while the current ROS source package is 3.1.0; the current Ordo/SDE "
              "distribution is 1.3.0 and the current Limen package is 0.6.1. The upgrade/install "
              "activity is therefore an explicit trial obligation under ARX-001 rather than an assumed prerequisite."
          )
          new = (
              "At the original extension review, the repository's installed ROS configuration identified "
              "1.2.1-main.16.1 while ROS 3.1.0 and Limen 0.6.1 were then observed upstream. Subsequent repository "
              "work installed ROS 3.1.3, SDE 1.3.0, and Limen 0.6.1. The 2026-09-22 finalization verified and "
              "advanced the baseline to ROS 3.1.4, SDE 1.3.0, and Limen 0.6.2. This upgrade history remains "
              "explicit trial evidence under ARX-001 rather than an assumed prerequisite."
          )
          if old not in text:
              raise SystemExit("expected framework observation text not found")
          ledger.write_text(text.replace(old, new))
          PY

      - name: Record durable framework verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/verification
          cat > docs/verification/framework-baseline-2026-09-22.md <<'EOF'
          # Echelon Signal Framework Baseline Verification — 2026-09-22

          This record captures the current-framework finalization performed from the then-current
          `main` branch, preserving concurrent repository work rather than replaying an older
          migration snapshot.

          ## Verified baseline

          - Repository Operating System (ROS): 3.1.4
          - State-Directed Engineering / Ordo execution package: 1.3.0
          - Limen: 0.6.2

          ## Verification

          - ROS 3.1.3 -> 3.1.4 lifecycle upgrade planned and applied through `ros upgrade`.
          - ROS strict installation verification passed.
          - SDE 1.3.0 strict verification passed.
          - Limen 0.6.1 -> 0.6.2 lifecycle upgrade planned and applied through `limen upgrade`.
          - Limen strict verification passed with explicit Signal engine/browser boundaries.
          - ROS registries were rebuilt and checked.
          - ROS unified repository validation passed.
          - Repository diff whitespace checks passed except for pre-existing tool-owned SDE payload
            EOF whitespace, whose managed bytes are intentionally preserved.

          ## Boundary decisions

          `src/Echelon.Signal.Engine` is the F#/.NET WebAssembly application-authority boundary.
          It owns domain state, legal transitions, scoring, validation, privacy rules, capabilities,
          obligations, effects-as-data, and view projection.

          `src/Echelon.Signal.Browser` is the thin browser-facing boundary. Browser mechanisms are
          provided through Limen; Signal domain decisions must not be re-derived there.

          `tools/ros_cli.mjs` is excluded only from SDE structural-size review because it is retained
          ROS compatibility tooling rather than Signal product code. Structural review remains strict
          for supported Signal source paths.

          ## Trial observations

          The finalization was deliberately rebased conceptually onto current `main` after detecting
          substantial concurrent repository activity. This avoided overwriting newer requirements and
          capability work with an older migration snapshot. That concurrency event is part of the ROS /
          Ordo trial evidence for safe repository evolution.
          EOF

      - name: Rebuild and verify ROS
        shell: bash
        run: |
          set -euo pipefail
          ./ros registry build | tee /tmp/framework-finalization/ros-registry-build.txt
          ./ros registry check | tee /tmp/framework-finalization/ros-registry-check.txt
          ./ros validate --json | tee /tmp/framework-finalization/ros-validate-before-complete.json
          ./ros verify --strict --json | tee /tmp/framework-finalization/ros-final-verify.json

      - name: Complete framework work item
        shell: bash
        run: |
          set -euo pipefail
          ./ros work complete \
            --id SIGNAL-FRAMEWORK-2026-09-22 \
            --occurred-at 2026-09-22T09:00:59.000Z \
            --evidence implementation=.github/workflows/echelon-verification.yml \
            --evidence tests=docs/verification/framework-baseline-2026-09-22.md
          ./ros validate --json | tee /tmp/framework-finalization/ros-validate-after-complete.json
          ./ros status --json | tee /tmp/framework-finalization/ros-status-after.json

      - name: Verify repository diff
        shell: bash
        run: |
          set -euo pipefail
          git status --short | tee /tmp/framework-finalization/git-status.txt
          git diff --stat | tee /tmp/framework-finalization/git-diff-stat.txt

      - name: Upload finalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framework-current-finalization-evidence
          path: /tmp/framework-finalization/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit non-workflow framework state
        shell: bash
        run: |
          set -euo pipefail

          rm -f .github/workflows/framework-current-finalize.yml

          git add -A

          # The Actions token cannot create/update/delete workflow files. The
          # repository API will apply the already-verified permanent workflow
          # edit and remove this temporary workflow after this commit lands.
          git restore --staged .github/workflows || true

          set +e
          git diff --cached --check > /tmp/framework-finalization/staged-whitespace.txt 2>&1
          whitespace_code=$?
          set -e

          if [ "$whitespace_code" -ne 0 ]; then
            cat /tmp/framework-finalization/staged-whitespace.txt
            if grep -v '^\.sde/' /tmp/framework-finalization/staged-whitespace.txt | grep -q '[^[:space:]]'; then
              echo "Repository-owned whitespace finding detected; refusing to commit."
              exit "$whitespace_code"
            fi
            echo "Only tool-owned .sde payload whitespace findings are present; preserving managed bytes."
          fi

          if git diff --cached --quiet; then
            echo "No non-workflow framework changes to commit."
            exit 0
          fi

          git commit -m "SIGNAL-FRAMEWORK-2026-09-22: finalize current framework baseline"
          git push origin HEAD:${{ github.ref_name }}
